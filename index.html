<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Bill Splitter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --primary-light: #eef2ff;
      --bg: #f1f5f9;
      --card-bg: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --danger: #ef4444;
      --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
      --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
      --radius: 12px;
    }

    * { box-sizing: border-box; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'PingFang HK', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px 16px 32px 16px;
      line-height: 1.5;
    }

    .top-bar {
      display: flex;
      justify-content: flex-end;
      max-width: 800px;
      margin: 0 auto 16px auto;
    }

    .lang-switch {
      display: flex;
      background: var(--border);
      padding: 3px;
      border-radius: 8px;
      gap: 2px;
    }

    .lang-btn {
      background: transparent;
      color: var(--text-muted);
      border: none;
      padding: 5px 12px;
      font-size: 0.8rem;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.2s ease;
    }

    .lang-btn.active {
      background: var(--card-bg);
      color: var(--primary);
      font-weight: 600;
      box-shadow: var(--shadow-sm);
    }

    .app-header {
      text-align: center;
      max-width: 800px;
      margin: 0 auto 32px auto;
    }

    .app-header h1 {
      margin: 0;
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.025em;
    }

    .app-header p {
      margin: 8px 0 0 0;
      color: var(--text-muted);
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      display: grid;
      gap: 24px;
      grid-template-columns: 1fr;
    }

    @media (min-width: 768px) {
      .container { grid-template-columns: 1fr 1fr; }
      .full-width { grid-column: span 2; }
    }

    .card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border);
      transition: box-shadow 0.2s ease;
    }

    .card:hover {
      box-shadow: var(--shadow);
    }

    .card-header-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .card-title {
      margin: 0;
      font-size: 1.125rem;
      font-weight: 600;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--text);
    }

    input[type="text"], input[type="number"], select {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-family: inherit;
      font-size: 0.95rem;
      color: var(--text);
      background-color: #fff;
      transition: all 0.2s ease;
      text-transform: none;
    }

    input[type="text"]:focus, input[type="number"]:focus, select:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
    }

    .split-toggle-group {
      display: flex;
      gap: 8px;
      background: var(--bg);
      padding: 4px;
      border-radius: 8px;
      border: 1px solid var(--border);
    }

    .split-toggle-btn {
      flex: 1;
      background: transparent;
      color: var(--text-muted);
      border: none;
      padding: 8px;
      font-size: 0.85rem;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.2s ease;
    }

    .split-toggle-btn.active {
      background: var(--card-bg);
      color: var(--primary);
      font-weight: 600;
      box-shadow: var(--shadow-sm);
    }

    .input-btn-group {
      display: flex;
      gap: 8px;
    }

    button {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      font-family: inherit;
      font-size: 0.925rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s ease, transform 0.1s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    button:hover { background-color: var(--primary-hover); }
    button:active { transform: scale(0.98); }

    .btn-secondary {
      background-color: transparent;
      color: var(--primary);
      border: 1px solid var(--primary);
      padding: 6px 14px;
      font-size: 0.85rem;
    }

    .btn-secondary:hover {
      background-color: var(--primary-light);
    }

    .btn-block { width: 100%; margin-top: 8px; }

    .tags-container {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }

    .person-tag {
      background: var(--primary-light);
      color: var(--primary);
      padding: 6px 10px 6px 12px;
      border-radius: 20px;
      font-size: 0.875rem;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      text-transform: none;
    }

    .btn-remove-tag {
      background: none;
      border: none;
      color: var(--primary);
      cursor: pointer;
      font-size: 1rem;
      padding: 0;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      opacity: 0.7;
      transition: opacity 0.2s ease, background-color 0.2s ease;
    }

    .btn-remove-tag:hover {
      opacity: 1;
      background-color: rgba(79, 70, 229, 0.15);
    }

    .checkbox-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
      gap: 8px;
      margin-top: 8px;
    }

    .exact-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 8px;
    }

    .exact-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .checkbox-card {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.875rem;
      user-select: none;
      transition: border-color 0.2s ease;
    }

    .checkbox-card:hover { border-color: var(--primary); }
    .checkbox-card input { accent-color: var(--primary); }

    .list-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
    }

    .list-item:last-child { border-bottom: none; }
    .list-item-title { font-weight: 500; }
    .list-item-sub { font-size: 0.825rem; color: var(--text-muted); }

    .btn-delete-item {
      background: transparent;
      color: var(--text-muted);
      border: none;
      padding: 6px 10px;
      font-size: 1rem;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-delete-item:hover {
      color: var(--danger);
      background-color: #fef2f2;
    }

    .settlement-card {
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      border-radius: 8px;
      padding: 14px 16px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .settlement-text { font-weight: 500; color: #166534; }
    .settlement-amount { font-weight: 700; color: #15803d; }

    .empty-state {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.9rem;
      padding: 24px 0;
    }
  </style>
</head>
<body>

<div class="top-bar">
  <div class="lang-switch">
    <button type="button" class="lang-btn" id="langEnBtn" onclick="setLanguage('en')">English</button>
    <button type="button" class="lang-btn active" id="langZhBtn" onclick="setLanguage('zh')">繁體中文</button>
  </div>
</div>

<header class="app-header">
  <h1 id="i18n-appTitle">AA制 帳單計算器</h1>
  <p id="i18n-appSub">新增成員、記錄開支，自動計算最簡結算方案。</p>
</header>

<div class="container">
  
  <div class="card">
    <h2 class="card-title" id="i18n-step1Title" style="margin-bottom: 16px;">1. 參與者</h2>
    <div class="form-group">
      <div class="input-btn-group">
        <input type="text" id="personName" placeholder="例如：阿樂 / Alex" onkeydown="if(event.key==='Enter') addPerson()">
        <button type="button" id="i18n-addPersonBtn" onclick="addPerson()">新增</button>
      </div>
    </div>
    <div class="tags-container" id="peopleTags">
      <span class="empty-state" id="i18n-noParticipants">尚未新增參與者。</span>
    </div>
  </div>

  <div class="card">
    <h2 class="card-title" id="i18n-step2Title" style="margin-bottom: 16px;">2. 新增開支</h2>
    <div class="form-group">
      <label for="expenseDesc" id="i18n-descLabel">項目名稱</label>
      <input type="text" id="expenseDesc" placeholder="例如：晚餐、的士">
    </div>

    <div class="form-group">
      <label id="i18n-splitMethodLabel">分攤方式</label>
      <div class="split-toggle-group">
        <button type="button" class="split-toggle-btn active" id="btnSplitEven" onclick="setSplitMode('even')">平分</button>
        <button type="button" class="split-toggle-btn" id="btnSplitExact" onclick="setSplitMode('exact')">按指定金額</button>
      </div>
    </div>

    <div class="form-group" id="totalAmountGroup">
      <label for="expenseAmount" id="i18n-totalAmountLabel">總金額 ($)</label>
      <input type="number" id="expenseAmount" step="1" min="1" placeholder="0">
    </div>

    <div class="form-group">
      <label for="paidBySelect" id="i18n-paidByLabel">付款人</label>
      <select id="paidBySelect"></select>
    </div>

    <div class="form-group">
      <label id="i18n-splitAmongLabel">分攤成員</label>
      <div id="splitAmongContainer"></div>
    </div>
    <button type="button" class="btn-block" id="i18n-addExpenseBtn" onclick="addExpense()">新增開支</button>
  </div>

  <div class="card full-width">
    <h2 class="card-title" id="i18n-step3Title" style="margin-bottom: 16px;">3. 開支摘要</h2>
    <div id="expenseList">
      <div class="empty-state" id="i18n-noExpenses">尚未記錄任何開支。</div>
    </div>
  </div>

  <div class="card full-width">
    <div class="card-header-actions">
      <h2 class="card-title" id="i18n-step4Title">4. 結算方案</h2>
      <button type="button" id="copyBtn" class="btn-secondary" onclick="copySettlement()">📋 複製摘要與方案</button>
    </div>
    <div id="settlementResults">
      <div class="empty-state" id="i18n-noSettlementPrompt">請新增參與者及開支以生成結算方案。</div>
    </div>
  </div>

</div>

<script>
  let currentLang = 'zh';
  let people = [];
  let expenses = [];
  let currentTransactions = [];
  let splitMode = 'even';

  const i18n = {
    en: {
      appTitle: "Bill Splitter",
      appSub: "Add group members, record expenses, and get the simplest path to settle up.",
      step1Title: "1. Participants",
      personPlaceholder: "e.g. Alex",
      addPersonBtn: "Add",
      noParticipants: "No participants added yet.",
      step2Title: "2. Add Expense",
      descLabel: "Description",
      descPlaceholder: "e.g. Dinner, Taxi",
      splitMethodLabel: "Split Method",
      splitEven: "Split Evenly",
      splitExact: "Exact Amounts",
      totalAmountLabel: "Total Amount ($)",
      paidByLabel: "Paid By",
      splitAmongLabel: "Split Among",
      addExpenseBtn: "Add Expense",
      addFirstPrompt: "Add participants above first.",
      step3Title: "3. Expenses Summary",
      noExpenses: "No expenses logged yet.",
      paidBy: "Paid by",
      step4Title: "4. Settlement Plan",
      copyBtn: "📋 Copy Summary & Plan",
      copied: "✓ Copied!",
      noSettlementPrompt: "Add participants and expenses to generate a settlement plan.",
      everyoneEven: "Everyone is even! No payments needed.",
      pays: "pays",
      formatSettlement: (debtor, creditor, amount) => `${debtor} pays ${creditor} $${amount}`,
      formatCopyPaidBy: (paidBy) => `Paid by ${paidBy}`,
      alertDescPaidBy: "Please enter a description and select who paid.",
      alertValidAmount: "Please enter a valid whole dollar amount.",
      alertSelectParticipant: "Please select at least one person sharing the expense.",
      alertValidAmountExact: "Please enter a valid whole dollar amount greater than 0 for all selected participants.",
      alertSumMismatch: (sum, total) => `The sum of exact shares ($${sum}) does not match Total Amount ($${total}).`,
      alertAddExpensesFirst: "Please add expenses first.",
      copyHeaderExpense: "📝 EXPENSE SUMMARY",
      copyHeaderTotal: "Total Spent",
      copyHeaderSettlement: "💰 SETTLEMENT PLAN"
    },
    zh: {
      appTitle: "AA制 帳單計算器",
      appSub: "新增成員、記錄開支，自動計算最簡結算方案。",
      step1Title: "1. 參與者",
      personPlaceholder: "例如：阿樂 / Alex",
      addPersonBtn: "新增",
      noParticipants: "尚未新增參與者。",
      step2Title: "2. 新增開支",
      descLabel: "項目名稱",
      descPlaceholder: "例如：晚餐、的士",
      splitMethodLabel: "分攤方式",
      splitEven: "平分",
      splitExact: "按指定金額",
      totalAmountLabel: "總金額 ($)",
      paidByLabel: "付款人",
      splitAmongLabel: "分攤成員",
      addExpenseBtn: "新增開支",
      addFirstPrompt: "請先在上方新增參與者。",
      step3Title: "3. 開支摘要",
      noExpenses: "尚未記錄任何開支。",
      paidBy: "付款人：",
      step4Title: "4. 結算方案",
      copyBtn: "📋 複製摘要與方案",
      copied: "✓ 已複製！",
      noSettlementPrompt: "請新增參與者及開支以生成結算方案。",
      everyoneEven: "大家已清帳，無需付款！",
      pays: "需付給",
      formatSettlement: (debtor, creditor, amount) => `${debtor} 需付給 ${creditor} $${amount}`,
      formatCopyPaidBy: (paidBy) => `付款人：${paidBy}`,
      alertDescPaidBy: "請輸入項目名稱並選擇付款人。",
      alertValidAmount: "請輸入有效的整數金額。",
      alertSelectParticipant: "請至少選擇一位分攤開支的成員。",
      alertValidAmountExact: "請為所有已選擇的成員輸入大於 0 的整數金額。",
      alertSumMismatch: (sum, total) => `分攤金額總和 ($${sum}) 與總金額 ($${total}) 不符。`,
      alertAddExpensesFirst: "請先新增開支項目。",
      copyHeaderExpense: "📝 開支摘要",
      copyHeaderTotal: "總支出",
      copyHeaderSettlement: "💰 結算方案"
    }
  };

  window.addEventListener('DOMContentLoaded', () => {
    applyLanguage();
  });

  function setLanguage(lang) {
    if (currentLang === lang) return;
    currentLang = lang;

    document.getElementById('langEnBtn').classList.toggle('active', lang === 'en');
    document.getElementById('langZhBtn').classList.toggle('active', lang === 'zh');
    document.documentElement.lang = lang === 'zh' ? 'zh-HK' : 'en';

    applyLanguage();
  }

  function applyLanguage() {
    const t = i18n[currentLang];

    document.getElementById('i18n-appTitle').innerText = t.appTitle;
    document.getElementById('i18n-appSub').innerText = t.appSub;
    document.getElementById('i18n-step1Title').innerText = t.step1Title;
    document.getElementById('personName').placeholder = t.personPlaceholder;
    document.getElementById('i18n-addPersonBtn').innerText = t.addPersonBtn;
    document.getElementById('i18n-step2Title').innerText = t.step2Title;
    document.getElementById('i18n-descLabel').innerText = t.descLabel;
    document.getElementById('expenseDesc').placeholder = t.descPlaceholder;
    document.getElementById('i18n-splitMethodLabel').innerText = t.splitMethodLabel;
    document.getElementById('btnSplitEven').innerText = t.splitEven;
    document.getElementById('btnSplitExact').innerText = t.splitExact;
    document.getElementById('i18n-totalAmountLabel').innerText = t.totalAmountLabel;
    document.getElementById('i18n-paidByLabel').innerText = t.paidByLabel;
    document.getElementById('i18n-splitAmongLabel').innerText = t.splitAmongLabel;
    document.getElementById('i18n-addExpenseBtn').innerText = t.addExpenseBtn;
    document.getElementById('i18n-step3Title').innerText = t.step3Title;
    document.getElementById('i18n-step4Title').innerText = t.step4Title;
    document.getElementById('copyBtn').innerText = t.copyBtn;

    updateUI();
    calculateSettlements();
  }

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  function setSplitMode(mode) {
    splitMode = mode;
    const btnEven = document.getElementById('btnSplitEven');
    const btnExact = document.getElementById('btnSplitExact');
    if (btnEven) btnEven.classList.toggle('active', mode === 'even');
    if (btnExact) btnExact.classList.toggle('active', mode === 'exact');
    renderSplitContainer();
  }

  function addPerson() {
    const input = document.getElementById('personName');
    if (!input) return;
    const name = input.value.trim();
    if (!name || people.includes(name)) return;

    people.push(name);
    input.value = '';
    updateUI();
  }

  function removePerson(index) {
    if (index < 0 || index >= people.length) return;
    const personToRemove = people[index];
    people.splice(index, 1);

    expenses = expenses.map(e => {
      const newSplits = { ...e.splits };
      delete newSplits[personToRemove];
      const newTotal = Object.values(newSplits).reduce((sum, val) => sum + val, 0);
      return { ...e, splits: newSplits, amount: newTotal };
    }).filter(e => e.paidBy !== personToRemove && Object.keys(e.splits).length > 0);

    updateUI();
    calculateSettlements();
  }

  function renderSplitContainer() {
    const container = document.getElementById('splitAmongContainer');
    if (!container) return;
    const t = i18n[currentLang];
    
    if (people.length === 0) {
      container.innerHTML = `<span class="empty-state" style="padding: 8px 0;">${t.addFirstPrompt}</span>`;
      return;
    }

    if (splitMode === 'even') {
      container.innerHTML = `
        <div class="checkbox-grid">
          ${people.map(p => `
            <label class="checkbox-card">
              <input type="checkbox" value="${escapeHtml(p)}" class="split-even-cb" checked> ${escapeHtml(p)}
            </label>
          `).join('')}
        </div>
      `;
    } else {
      container.innerHTML = `
        <div class="exact-grid">
          ${people.map(p => `
            <div class="exact-row">
              <label class="checkbox-card" style="flex: 1;">
                <input type="checkbox" value="${escapeHtml(p)}" class="split-exact-cb" checked onchange="toggleExactInput('${escapeHtml(p)}')"> ${escapeHtml(p)}
              </label>
              <input type="number" step="1" min="0" placeholder="0" class="exact-input" id="exact-input-${escapeHtml(p)}" style="width: 120px;">
            </div>
          `).join('')}
        </div>
      `;
    }
  }

  function toggleExactInput(person) {
    const cb = document.querySelector(`.split-exact-cb[value="${person}"]`);
    const input = document.getElementById(`exact-input-${person}`);
    if (input && cb) {
      input.disabled = !cb.checked;
      if (!cb.checked) input.value = '';
    }
  }

  function addExpense() {
    const descInput = document.getElementById('expenseDesc');
    const paidBySelect = document.getElementById('paidBySelect');
    const t = i18n[currentLang];

    if (!descInput || !paidBySelect) return;

    const desc = descInput.value.trim();
    const paidBy = paidBySelect.value;
    
    if (!desc || !paidBy) {
      alert(t.alertDescPaidBy);
      return;
    }

    let splits = {};
    let total = 0;

    if (splitMode === 'even') {
      const amountInput = document.getElementById('expenseAmount');
      const amountVal = amountInput ? parseInt(amountInput.value, 10) : 0;
      if (isNaN(amountVal) || amountVal <= 0) {
        alert(t.alertValidAmount);
        return;
      }

      total = Math.round(amountVal);
      const selected = Array.from(document.querySelectorAll('.split-even-cb:checked')).map(cb => cb.value);

      if (selected.length === 0) {
        alert(t.alertSelectParticipant);
        return;
      }

      const numPeople = selected.length;
      const baseShare = Math.floor(total / numPeople);
      let remainder = total % numPeople;

      selected.forEach(person => {
        let share = baseShare;
        if (remainder > 0) {
          share += 1;
          remainder--;
        }
        splits[person] = share;
      });

    } else {
      const checkedBoxes = document.querySelectorAll('.split-exact-cb:checked');
      if (checkedBoxes.length === 0) {
        alert(t.alertSelectParticipant);
        return;
      }

      let hasInvalidAmount = false;
      checkedBoxes.forEach(cb => {
        const person = cb.value;
        const inputEl = document.getElementById(`exact-input-${person}`);
        const val = inputEl ? parseInt(inputEl.value, 10) : NaN;
        if (isNaN(val) || val <= 0) {
          hasInvalidAmount = true;
        } else {
          const share = Math.round(val);
          splits[person] = share;
          total += share;
        }
      });

      if (hasInvalidAmount) {
        alert(t.alertValidAmountExact);
        return;
      }

      const totalInput = document.getElementById('expenseAmount');
      const totalInputVal = totalInput ? parseInt(totalInput.value, 10) : NaN;
      if (!isNaN(totalInputVal) && totalInputVal > 0) {
        if (totalInputVal !== total) {
          alert(t.alertSumMismatch(total, totalInputVal));
          return;
        }
      }
    }

    expenses.push({ desc, amount: total, paidBy, splits, splitMode });
    
    if (descInput) descInput.value = '';
    const amountInput = document.getElementById('expenseAmount');
    if (amountInput) amountInput.value = '';
    
    updateUI();
    calculateSettlements();
  }

  function removeExpense(index) {
    if (index < 0 || index >= expenses.length) return;
    expenses.splice(index, 1);
    updateUI();
    calculateSettlements();
  }

  function updateUI() {
    const t = i18n[currentLang];
    const peopleTags = document.getElementById('peopleTags');
    
    if (peopleTags) {
      if (people.length === 0) {
        peopleTags.innerHTML = `<span class="empty-state">${t.noParticipants}</span>`;
      } else {
        peopleTags.innerHTML = people.map((p, i) => `
          <span class="person-tag">
            ${escapeHtml(p)}
            <button type="button" class="btn-remove-tag" onclick="removePerson(${i})" title="Remove ${escapeHtml(p)}">✕</button>
          </span>
        `).join('');
      }
    }

    const paidBySelect = document.getElementById('paidBySelect');
    if (paidBySelect) {
      paidBySelect.innerHTML = people.map(p => `<option value="${escapeHtml(p)}">${escapeHtml(p)}</option>`).join('');
    }

    renderSplitContainer();

    const expenseList = document.getElementById('expenseList');
    if (expenseList) {
      if (expenses.length === 0) {
        expenseList.innerHTML = `<div class="empty-state">${t.noExpenses}</div>`;
      } else {
        expenseList.innerHTML = expenses.map((e, i) => {
          const splitDetails = Object.entries(e.splits)
            .map(([p, amt]) => `${escapeHtml(p)} ($${amt})`)
            .join(', ');

          return `
            <div class="list-item">
              <div>
                <div class="list-item-title">${escapeHtml(e.desc)}</div>
                <div class="list-item-sub">${t.paidBy} <strong>${escapeHtml(e.paidBy)}</strong> — ${splitDetails}</div>
              </div>
              <div style="display: flex; align-items: center; gap: 12px;">
                <span style="font-weight: 600;">$${e.amount}</span>
                <button type="button" class="btn-delete-item" onclick="removeExpense(${i})" title="Delete expense">✕</button>
              </div>
            </div>
          `;
        }).join('');
      }
    }
  }

  function calculateSettlements() {
    const t = i18n[currentLang];
    const balances = {};
    people.forEach(p => balances[p] = 0);

    expenses.forEach(({ paidBy, amount, splits }) => {
      if (balances.hasOwnProperty(paidBy)) {
        balances[paidBy] += amount;
      }
      for (const [person, share] of Object.entries(splits)) {
        if (balances.hasOwnProperty(person)) {
          balances[person] -= share;
        }
      }
    });

    const debtors = [];
    const creditors = [];

    for (const [person, balance] of Object.entries(balances)) {
      if (balance < 0) debtors.push({ person, amount: -balance });
      else if (balance > 0) creditors.push({ person, amount: balance });
    }

    currentTransactions = [];
    let i = 0, j = 0;

    while (i < debtors.length && j < creditors.length) {
      const debtor = debtors[i];
      const creditor = creditors[j];
      const settled = Math.min(debtor.amount, creditor.amount);

      currentTransactions.push({ 
        debtor: debtor.person, 
        creditor: creditor.person, 
        amount: settled 
      });

      debtor.amount -= settled;
      creditor.amount -= settled;

      if (debtor.amount === 0) i++;
      if (creditor.amount === 0) j++;
    }

    const container = document.getElementById('settlementResults');
    if (!container) return;

    if (expenses.length === 0) {
      container.innerHTML = `<div class="empty-state">${t.noSettlementPrompt}</div>`;
    } else if (currentTransactions.length === 0) {
      container.innerHTML = `<div class="settlement-card"><span class="settlement-text">${t.everyoneEven}</span></div>`;
    } else {
      container.innerHTML = currentTransactions.map(tr => `
        <div class="settlement-card">
          <span class="settlement-text"><strong>${escapeHtml(tr.debtor)}</strong> ${t.pays} <strong>${escapeHtml(tr.creditor)}</strong></span>
          <span class="settlement-amount">$${tr.amount}</span>
        </div>
      `).join('');
    }
  }

  function copySettlement() {
    const copyBtn = document.getElementById('copyBtn');
    const t = i18n[currentLang];

    if (expenses.length === 0) {
      alert(t.alertAddExpensesFirst);
      return;
    }

    const totalSpent = expenses.reduce((sum, e) => sum + e.amount, 0);

    let textToCopy = `${t.copyHeaderExpense}\n`;
    textToCopy += `${t.copyHeaderTotal}: $${totalSpent}\n`;
    textToCopy += "-----------------------------------\n";
    
    expenses.forEach(e => {
      const splitDetails = Object.entries(e.splits)
        .map(([p, amt]) => `${p}: $${amt}`)
        .join(', ');
      textToCopy += `• ${e.desc}: $${e.amount} (${t.formatCopyPaidBy(e.paidBy)} | ${splitDetails})\n`;
    });

    textToCopy += `\n${t.copyHeaderSettlement}\n`;
    textToCopy += "-----------------------------------\n";

    if (currentTransactions.length === 0) {
      textToCopy += t.everyoneEven;
    } else {
      textToCopy += currentTransactions.map(tr => `• ${t.formatSettlement(tr.debtor, tr.creditor, tr.amount)}`).join('\n');
    }

    navigator.clipboard.writeText(textToCopy).then(() => {
      if (copyBtn) {
        const originalText = copyBtn.innerText;
        copyBtn.innerText = t.copied;
        setTimeout(() => {
          copyBtn.innerText = originalText;
        }, 2000);
      }
    }).catch(err => {
      alert("Failed to copy. Please copy manually.");
    });
  }
</script>
