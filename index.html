<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Bill Splitter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --primary-light: #eef2ff;
      --bg: #f1f5f9;
      --card-bg: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --success: #10b981;
      --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
      --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
      --radius: 12px;
    }

    * { box-sizing: border-box; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 32px 16px;
      line-height: 1.5;
    }

    .app-header {
      text-align: center;
      max-width: 800px;
      margin: 0 auto 32px auto;
    }

    .app-header h1 {
      margin: 0;
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.025em;
    }

    .app-header p {
      margin: 8px 0 0 0;
      color: var(--text-muted);
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      display: grid;
      gap: 24px;
      grid-template-columns: 1fr;
    }

    @media (min-width: 768px) {
      .container { grid-template-columns: 1fr 1fr; }
      .full-width { grid-column: span 2; }
    }

    .card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border);
      transition: box-shadow 0.2s ease;
    }

    .card:hover {
      box-shadow: var(--shadow);
    }

    .card-title {
      margin: 0 0 16px 0;
      font-size: 1.125rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--text);
    }

    input[type="text"], input[type="number"], select {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-family: inherit;
      font-size: 0.95rem;
      color: var(--text);
      background-color: #fff;
      transition: all 0.2s ease;
    }

    input[type="text"]:focus, input[type="number"]:focus, select:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
    }

    .input-btn-group {
      display: flex;
      gap: 8px;
    }

    button {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      font-family: inherit;
      font-size: 0.925rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s ease, transform 0.1s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    button:hover { background-color: var(--primary-hover); }
    button:active { transform: scale(0.98); }

    .btn-block { width: 100%; margin-top: 8px; }

    .tags-container {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }

    .person-tag {
      background: var(--primary-light);
      color: var(--primary);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.875rem;
      font-weight: 500;
    }

    .checkbox-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
      gap: 8px;
      margin-top: 8px;
    }

    .checkbox-card {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.875rem;
      user-select: none;
      transition: border-color 0.2s ease;
    }

    .checkbox-card:hover { border-color: var(--primary); }
    .checkbox-card input { accent-color: var(--primary); }

    .list-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
    }

    .list-item:last-child { border-bottom: none; }
    .list-item-title { font-weight: 500; }
    .list-item-sub { font-size: 0.825rem; color: var(--text-muted); }

    .settlement-card {
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      border-radius: 8px;
      padding: 14px 16px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .settlement-text { font-weight: 500; color: #166534; }
    .settlement-amount { font-weight: 700; color: #15803d; }

    .empty-state {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.9rem;
      padding: 24px 0;
    }
  </style>
</head>
<body>

<header class="app-header">
  <h1>Bill Splitter</h1>
  <p>Add group members, record expenses, and get the simplest path to settle up.</p>
</header>

<div class="container">
  
  <!-- 1. Add Participants -->
  <div class="card">
    <h2 class="card-title">1. Participants</h2>
    <div class="form-group">
      <div class="input-btn-group">
        <input type="text" id="personName" placeholder="e.g. Alex" onkeydown="if(event.key==='Enter') addPerson()">
        <button onclick="addPerson()">Add</button>
      </div>
    </div>
    <div class="tags-container" id="peopleTags">
      <span class="empty-state">No participants added yet.</span>
    </div>
  </div>

  <!-- 2. Add Expense -->
  <div class="card">
    <h2 class="card-title">2. Add Expense</h2>
    <div class="form-group">
      <label for="expenseDesc">Description</label>
      <input type="text" id="expenseDesc" placeholder="e.g. Dinner, Taxi">
    </div>
    <div class="form-group">
      <label for="expenseAmount">Amount ($)</label>
      <input type="number" id="expenseAmount" step="0.01" placeholder="0.00">
    </div>
    <div class="form-group">
      <label for="paidBySelect">Paid By</label>
      <select id="paidBySelect"></select>
    </div>
    <div class="form-group">
      <label>Split Among</label>
      <div id="splitAmongCheckboxes" class="checkbox-grid"></div>
    </div>
    <button class="btn-block" onclick="addExpense()">Add Expense</button>
  </div>

  <!-- 3. Expenses List -->
  <div class="card full-width">
    <h2 class="card-title">3. Expenses Summary</h2>
    <div id="expenseList">
      <div class="empty-state">No expenses logged yet.</div>
    </div>
  </div>

  <!-- 4. Final Settlement -->
  <div class="card full-width">
    <h2 class="card-title">4. Settlement Plan</h2>
    <div id="settlementResults">
      <div class="empty-state">Add participants and expenses to generate a settlement plan.</div>
    </div>
  </div>

</div>

<script>
  const people = [];
  const expenses = [];

  function addPerson() {
    const input = document.getElementById('personName');
    const name = input.value.trim();
    if (!name || people.includes(name)) return;

    people.push(name);
    input.value = '';
    updateUI();
  }

  function addExpense() {
    const desc = document.getElementById('expenseDesc').value.trim();
    const amount = parseFloat(document.getElementById('expenseAmount').value);
    const paidBy = document.getElementById('paidBySelect').value;
    
    const checkboxes = document.querySelectorAll('#splitAmongCheckboxes input:checked');
    const splitAmong = Array.from(checkboxes).map(cb => cb.value);

    if (!desc || isNaN(amount) || amount <= 0 || !paidBy || splitAmong.length === 0) {
      alert("Please fill in all expense details and select at least one person sharing the expense.");
      return;
    }

    expenses.push({ desc, amount, paidBy, splitAmong });
    
    document.getElementById('expenseDesc').value = '';
    document.getElementById('expenseAmount').value = '';
    updateUI();
    calculateSettlements();
  }

  function updateUI() {
    // 1. Render People Tags
    const peopleTags = document.getElementById('peopleTags');
    if (people.length === 0) {
      peopleTags.innerHTML = `<span class="empty-state">No participants added yet.</span>`;
    } else {
      peopleTags.innerHTML = people.map(p => `<span class="person-tag">${p}</span>`).join('');
    }

    // 2. Update Paid By Dropdown
    const paidBySelect = document.getElementById('paidBySelect');
    paidBySelect.innerHTML = people.map(p => `<option value="${p}">${p}</option>`).join('');

    // 3. Update Split Among Checkboxes
    const checkboxes = document.getElementById('splitAmongCheckboxes');
    checkboxes.innerHTML = people.map(p => `
      <label class="checkbox-card">
        <input type="checkbox" value="${p}" checked> ${p}
      </label>
    `).join('');

    // 4. Render Expense List
    const expenseList = document.getElementById('expenseList');
    if (expenses.length === 0) {
      expenseList.innerHTML = `<div class="empty-state">No expenses logged yet.</div>`;
    } else {
      expenseList.innerHTML = expenses.map(e => `
        <div class="list-item">
          <div>
            <div class="list-item-title">${e.desc}</div>
            <div class="list-item-sub">Paid by <strong>${e.paidBy}</strong> for ${e.splitAmong.join(', ')}</div>
          </div>
          <div style="font-weight: 600;">$${e.amount.toFixed(2)}</div>
        </div>
      `).join('');
    }
  }

  function calculateSettlements() {
    const balances = {};
    people.forEach(p => balances[p] = 0);

    expenses.forEach(({ paidBy, amount, splitAmong }) => {
      const share = amount / splitAmong.length;
      balances[paidBy] += amount;
      splitAmong.forEach(person => balances[person] -= share);
    });

    const debtors = [];
    const creditors = [];

    for (const [person, balance] of Object.entries(balances)) {
      if (balance < -0.01) debtors.push({ person, amount: -balance });
      else if (balance > 0.01) creditors.push({ person, amount: balance });
    }

    const transactions = [];
    let i = 0, j = 0;

    while (i < debtors.length && j < creditors.length) {
      const debtor = debtors[i];
      const creditor = creditors[j];
      const settledAmount = Math.min(debtor.amount, creditor.amount);

      transactions.push({ debtor: debtor.person, creditor: creditor.person, amount: settledAmount });

      debtor.amount -= settledAmount;
      creditor.amount -= settledAmount;

      if (debtor.amount < 0.01) i++;
      if (creditor.amount < 0.01) j++;
    }

    const container = document.getElementById('settlementResults');
    if (expenses.length === 0) {
      container.innerHTML = `<div class="empty-state">Add participants and expenses to generate a settlement plan.</div>`;
    } else if (transactions.length === 0) {
      container.innerHTML = `<div class="settlement-card"><span class="settlement-text">Everyone is even! No payments needed.</span></div>`;
    } else {
      container.innerHTML = transactions.map(t => `
        <div class="settlement-card">
          <span class="settlement-text"><strong>${t.debtor}</strong> pays <strong>${t.creditor}</strong></span>
          <span class="settlement-amount">$${t.amount.toFixed(2)}</span>
        </div>
      `).join('');
    }
  }
</script>

</body>
</html>
