<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Bill Splitter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --primary-light: #eef2ff;
      --bg: #f1f5f9;
      --card-bg: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --danger: #ef4444;
      --danger-hover: #dc2626;
      --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
      --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
      --radius: 12px;
    }

    * { box-sizing: border-box; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 32px 16px;
      line-height: 1.5;
    }

    .app-header {
      text-align: center;
      max-width: 800px;
      margin: 0 auto 32px auto;
    }

    .app-header h1 {
      margin: 0;
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.025em;
    }

    .app-header p {
      margin: 8px 0 0 0;
      color: var(--text-muted);
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      display: grid;
      gap: 24px;
      grid-template-columns: 1fr;
    }

    @media (min-width: 768px) {
      .container { grid-template-columns: 1fr 1fr; }
      .full-width { grid-column: span 2; }
    }

    .card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border);
      transition: box-shadow 0.2s ease;
    }

    .card:hover {
      box-shadow: var(--shadow);
    }

    .card-header-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .card-title {
      margin: 0;
      font-size: 1.125rem;
      font-weight: 600;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--text);
    }

    input[type="text"], input[type="number"], select {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-family: inherit;
      font-size: 0.95rem;
      color: var(--text);
      background-color: #fff;
      transition: all 0.2s ease;
    }

    input[type="text"]:focus, input[type="number"]:focus, select:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
    }

    .input-btn-group {
      display: flex;
      gap: 8px;
    }

    button {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      font-family: inherit;
      font-size: 0.925rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s ease, transform 0.1s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    button:hover { background-color: var(--primary-hover); }
    button:active { transform: scale(0.98); }

    .btn-secondary {
      background-color: transparent;
      color: var(--primary);
      border: 1px solid var(--primary);
      padding: 6px 14px;
      font-size: 0.85rem;
    }

    .btn-secondary:hover {
      background-color: var(--primary-light);
    }

    .btn-block { width: 100%; margin-top: 8px; }

    .tags-container {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }

    .person-tag {
      background: var(--primary-light);
      color: var(--primary);
      padding: 6px 10px 6px 12px;
      border-radius: 20px;
      font-size: 0.875rem;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn-remove-tag {
      background: none;
      border: none;
      color: var(--primary);
      cursor: pointer;
      font-size: 1rem;
      padding: 0;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      opacity: 0.7;
      transition: opacity 0.2s ease, background-color 0.2s ease;
    }

    .btn-remove-tag:hover {
      opacity: 1;
      background-color: rgba(79, 70, 229, 0.15);
    }

    .checkbox-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
      gap: 8px;
      margin-top: 8px;
    }

    .checkbox-card {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.875rem;
      user-select: none;
      transition: border-color 0.2s ease;
    }

    .checkbox-card:hover { border-color: var(--primary); }
    .checkbox-card input { accent-color: var(--primary); }

    .list-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
    }

    .list-item:last-child { border-bottom: none; }
    .list-item-title { font-weight: 500; }
    .list-item-sub { font-size: 0.825rem; color: var(--text-muted); }

    .btn-delete-item {
      background: transparent;
      color: var(--text-muted);
      border: none;
      padding: 6px 10px;
      font-size: 1rem;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-delete-item:hover {
      color: var(--danger);
      background-color: #fef2f2;
    }

    .settlement-card {
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      border-radius: 8px;
      padding: 14px 16px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .settlement-text { font-weight: 500; color: #166534; }
    .settlement-amount { font-weight: 700; color: #15803d; }

    .empty-state {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.9rem;
      padding: 24px 0;
    }
  </style>
</head>
<body>

<header class="app-header">
  <h1>Bill Splitter</h1>
  <p>Add group members, record expenses, and get the simplest path to settle up.</p>
</header>

<div class="container">
  
  <!-- 1. Add Participants -->
  <div class="card">
    <h2 class="card-title" style="margin-bottom: 16px;">1. Participants</h2>
    <div class="form-group">
      <div class="input-btn-group">
        <input type="text" id="personName" placeholder="e.g. Alex" onkeydown="if(event.key==='Enter') addPerson()">
        <button onclick="addPerson()">Add</button>
      </div>
    </div>
    <div class="tags-container" id="peopleTags">
      <span class="empty-state">No participants added yet.</span>
    </div>
  </div>

  <!-- 2. Add Expense -->
  <div class="card">
    <h2 class="card-title" style="margin-bottom: 16px;">2. Add Expense</h2>
    <div class="form-group">
      <label for="expenseDesc">Description</label>
      <input type="text" id="expenseDesc" placeholder="e.g. Dinner, Taxi">
    </div>
    <div class="form-group">
      <label for="expenseAmount">Amount ($)</label>
      <input type="number" id="expenseAmount" step="0.01" placeholder="0.00">
    </div>
    <div class="form-group">
      <label for="paidBySelect">Paid By</label>
      <select id="paidBySelect"></select>
    </div>
    <div class="form-group">
      <label>Split Among</label>
      <div id="splitAmongCheckboxes" class="checkbox-grid"></div>
    </div>
    <button class="btn-block" onclick="addExpense()">Add Expense</button>
  </div>

  <!-- 3. Expenses List -->
  <div class="card full-width">
    <h2 class="card-title" style="margin-bottom: 16px;">3. Expenses Summary</h2>
    <div id="expenseList">
      <div class="empty-state">No expenses logged yet.</div>
    </div>
  </div>

  <!-- 4. Final Settlement -->
  <div class="card full-width">
    <div class="card-header-actions">
      <h2 class="card-title">4. Settlement Plan</h2>
      <button id="copyBtn" class="btn-secondary" onclick="copySettlement()">📋 Copy Summary & Plan</button>
    </div>
    <div id="settlementResults">
      <div class="empty-state">Add participants and expenses to generate a settlement plan.</div>
    </div>
  </div>

</div>

<script>
  let people = [];
  let expenses = [];
  let currentTransactions = [];

  function addPerson() {
    const input = document.getElementById('personName');
    const name = input.value.trim();
    if (!name || people.includes(name)) return;

    people.push(name);
    input.value = '';
    updateUI();
  }

  function removePerson(index) {
    const personToRemove = people[index];
    people.splice(index, 1);

    // Filter out expenses paid by or splitting among the removed person
    expenses = expenses.filter(e => e.paidBy !== personToRemove).map(e => ({
      ...e,
      splitAmong: e.splitAmong.filter(p => p !== personToRemove)
    })).filter(e => e.splitAmong.length > 0);

    updateUI();
    calculateSettlements();
  }

  function addExpense() {
    const desc = document.getElementById('expenseDesc').value.trim();
    const amountFloat = parseFloat(document.getElementById('expenseAmount').value);
    const paidBy = document.getElementById('paidBySelect').value;
    
    const checkboxes = document.querySelectorAll('#splitAmongCheckboxes input:checked');
    const splitAmong = Array.from(checkboxes).map(cb => cb.value);

    if (!desc || isNaN(amountFloat) || amountFloat <= 0 || !paidBy || splitAmong.length === 0) {
      alert("Please fill in all expense details and select at least one person sharing the expense.");
      return;
    }

    const amountCents = Math.round(amountFloat * 100);

    expenses.push({ desc, amountCents, paidBy, splitAmong });
    
    document.getElementById('expenseDesc').value = '';
    document.getElementById('expenseAmount').value = '';
    updateUI();
    calculateSettlements();
  }

  function removeExpense(index) {
    expenses.splice(index, 1);
    updateUI();
    calculateSettlements();
  }

  function updateUI() {
    // 1. Render People Tags
    const peopleTags = document.getElementById('peopleTags');
    if (people.length === 0) {
      peopleTags.innerHTML = `<span class="empty-state">No participants added yet.</span>`;
    } else {
      peopleTags.innerHTML = people.map((p, i) => `
        <span class="person-tag">
          ${p}
          <button class="btn-remove-tag" onclick="removePerson(${i})" title="Remove ${p}">✕</button>
        </span>
      `).join('');
    }

    // 2. Update Paid By Dropdown
    const paidBySelect = document.getElementById('paidBySelect');
    paidBySelect.innerHTML = people.map(p => `<option value="${p}">${p}</option>`).join('');

    // 3. Update Split Among Checkboxes
    const checkboxes = document.getElementById('splitAmongCheckboxes');
    checkboxes.innerHTML = people.map(p => `
      <label class="checkbox-card">
        <input type="checkbox" value="${p}" checked> ${p}
      </label>
    `).join('');

    // 4. Render Expense List
    const expenseList = document.getElementById('expenseList');
    if (expenses.length === 0) {
      expenseList.innerHTML = `<div class="empty-state">No expenses logged yet.</div>`;
    } else {
      expenseList.innerHTML = expenses.map((e, i) => `
        <div class="list-item">
          <div>
            <div class="list-item-title">${e.desc}</div>
            <div class="list-item-sub">Paid by <strong>${e.paidBy}</strong> for ${e.splitAmong.join(', ')}</div>
          </div>
          <div style="display: flex; align-items: center; gap: 12px;">
            <span style="font-weight: 600;">$${(e.amountCents / 100).toFixed(2)}</span>
            <button class="btn-delete-item" onclick="removeExpense(${i})" title="Delete expense">✕</button>
          </div>
        </div>
      `).join('');
    }
  }

  function calculateSettlements() {
    const balances = {};
    people.forEach(p => balances[p] = 0);

    expenses.forEach(({ paidBy, amountCents, splitAmong }) => {
      balances[paidBy] += amountCents;

      const numPeople = splitAmong.length;
      const baseShare = Math.floor(amountCents / numPeople);
      let remainderCents = amountCents % numPeople;

      splitAmong.forEach(person => {
        let personShare = baseShare;
        if (remainderCents > 0) {
          personShare += 1;
          remainderCents--;
        }
        balances[person] -= personShare;
      });
    });

    const debtors = [];
    const creditors = [];

    for (const [person, balance] of Object.entries(balances)) {
      if (balance < 0) debtors.push({ person, amountCents: -balance });
      else if (balance > 0) creditors.push({ person, amountCents: balance });
    }

    currentTransactions = [];
    let i = 0, j = 0;

    while (i < debtors.length && j < creditors.length) {
      const debtor = debtors[i];
      const creditor = creditors[j];
      const settledCents = Math.min(debtor.amountCents, creditor.amountCents);

      currentTransactions.push({ 
        debtor: debtor.person, 
        creditor: creditor.person, 
        amountCents: settledCents 
      });

      debtor.amountCents -= settledCents;
      creditor.amountCents -= settledCents;

      if (debtor.amountCents === 0) i++;
      if (creditor.amountCents === 0) j++;
    }

    const container = document.getElementById('settlementResults');
    if (expenses.length === 0) {
      container.innerHTML = `<div class="empty-state">Add participants and expenses to generate a settlement plan.</div>`;
    } else if (currentTransactions.length === 0) {
      container.innerHTML = `<div class="settlement-card"><span class="settlement-text">Everyone is even! No payments needed.</span></div>`;
    } else {
      container.innerHTML = currentTransactions.map(t => `
        <div class="settlement-card">
          <span class="settlement-text"><strong>${t.debtor}</strong> pays <strong>${t.creditor}</strong></span>
          <span class="settlement-amount">$${(t.amountCents / 100).toFixed(2)}</span>
        </div>
      `).join('');
    }
  }

  function copySettlement() {
    const copyBtn = document.getElementById('copyBtn');

    if (expenses.length === 0) {
      alert("Please add expenses first.");
      return;
    }

    const totalCents = expenses.reduce((sum, e) => sum + e.amountCents, 0);

    let textToCopy = "📝 EXPENSE SUMMARY\n";
    textToCopy += `Total Spent: $${(totalCents / 100).toFixed(2)}\n`;
    textToCopy += "-----------------------------------\n";
    
    expenses.forEach(e => {
      textToCopy += `• ${e.desc}: $${(e.amountCents / 100).toFixed(2)} (Paid by ${e.paidBy} for ${e.splitAmong.join(', ')})\n`;
    });

    textToCopy += "\n💰 SETTLEMENT PLAN\n";
    textToCopy += "-----------------------------------\n";

    if (currentTransactions.length === 0) {
      textToCopy += "Everyone is even! No payments needed.";
    } else {
      textToCopy += currentTransactions.map(t => `• ${t.debtor} pays ${t.creditor} $${(t.amountCents / 100).toFixed(2)}`).join('\n');
    }

    navigator.clipboard.writeText(textToCopy).then(() => {
      const originalText = copyBtn.innerText;
      copyBtn.innerText = "✓ Copied!";
      setTimeout(() => {
        copyBtn.innerText = originalText;
      }, 2000);
    }).catch(err => {
      alert("Failed to copy. Please copy manually.");
    });
  }
</script>

</body>
</html>
