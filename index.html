<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Bill Splitter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --primary-light: #eef2ff;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --danger: #ef4444;
      --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05), 0 2px 4px -2px rgb(0 0 0 / 0.05);
      --radius: 12px;
    }

    * { box-sizing: border-box; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 24px 16px;
      line-height: 1.5;
    }

    .app-header {
      text-align: center;
      max-width: 600px;
      margin: 0 auto 24px auto;
    }

    .app-header h1 {
      margin: 0;
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.025em;
    }

    .app-header p {
      margin: 6px 0 0 0;
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .card-title {
      margin: 0;
      font-size: 1rem;
      font-weight: 600;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .step-badge {
      background: var(--primary-light);
      color: var(--primary);
      font-size: 0.75rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 12px;
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-group:last-child {
      margin-bottom: 0;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-size: 0.825rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.025em;
    }

    input[type="text"], input[type="number"], select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-family: inherit;
      font-size: 0.95rem;
      color: var(--text);
      background-color: #fff;
      transition: all 0.15s ease;
    }

    input[type="text"]:focus, input[type="number"]:focus, select:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.12);
    }

    .split-toggle-group {
      display: flex;
      background: var(--bg);
      padding: 3px;
      border-radius: 8px;
      border: 1px solid var(--border);
    }

    .split-toggle-btn {
      flex: 1;
      background: transparent;
      color: var(--text-muted);
      border: none;
      padding: 8px;
      font-size: 0.85rem;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.15s ease;
    }

    .split-toggle-btn.active {
      background: var(--card-bg);
      color: var(--primary);
      box-shadow: 0 1px 2px rgb(0 0 0 / 0.05);
    }

    .input-btn-group {
      display: flex;
      gap: 8px;
    }

    button {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.15s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    button:hover { background-color: var(--primary-hover); }

    .btn-secondary {
      background-color: var(--primary-light);
      color: var(--primary);
      padding: 6px 12px;
      font-size: 0.825rem;
    }

    .btn-secondary:hover {
      background-color: #e0e7ff;
    }

    .btn-block { width: 100%; margin-top: 6px; }

    .tags-container {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 10px;
    }

    .person-tag {
      background: var(--primary-light);
      color: var(--primary);
      padding: 4px 8px 4px 10px;
      border-radius: 16px;
      font-size: 0.85rem;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn-remove-tag {
      background: none;
      border: none;
      color: var(--primary);
      cursor: pointer;
      font-size: 0.9rem;
      padding: 0;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      opacity: 0.7;
    }

    .btn-remove-tag:hover {
      opacity: 1;
      background-color: rgba(79, 70, 229, 0.15);
    }

    .checkbox-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 8px;
    }

    .exact-grid {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .exact-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .checkbox-card {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.875rem;
      user-select: none;
      background: #fff;
    }

    .checkbox-card input { accent-color: var(--primary); }

    .list-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
    }

    .list-item:last-child { border-bottom: none; }
    .list-item-title { font-weight: 600; font-size: 0.95rem; }
    .list-item-sub { font-size: 0.8rem; color: var(--text-muted); }

    .btn-delete-item {
      background: transparent;
      color: var(--text-muted);
      border: none;
      padding: 4px 8px;
      font-size: 0.9rem;
      border-radius: 6px;
      cursor: pointer;
    }

    .btn-delete-item:hover {
      color: var(--danger);
      background-color: #fef2f2;
    }

    .settlement-card {
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      border-radius: 8px;
      padding: 12px 14px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .settlement-card:last-child { margin-bottom: 0; }
    .settlement-text { font-weight: 500; color: #166534; font-size: 0.9rem; }
    .settlement-amount { font-weight: 700; color: #15803d; font-size: 1rem; }

    .empty-state {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.85rem;
      padding: 12px 0;
    }
  </style>
</head>
<body>

<header class="app-header">
  <h1>Bill Splitter</h1>
  <p>Track group expenses and calculate whole-dollar settlements.</p>
</header>

<div class="container">
  
  <div class="card">
    <div class="card-header">
      <h2 class="card-title"><span class="step-badge">1</span> Participants</h2>
    </div>
    <div class="form-group">
      <div class="input-btn-group">
        <input type="text" id="personName" placeholder="Enter name" onkeydown="if(event.key==='Enter') addPerson()">
        <button type="button" onclick="addPerson()">Add</button>
      </div>
    </div>
    <div class="tags-container" id="peopleTags">
      <span class="empty-state">No participants added yet.</span>
    </div>
  </div>

  <div class="card">
    <div class="card-header">
      <h2 class="card-title"><span class="step-badge">2</span> Add Expense</h2>
    </div>

    <div class="form-group">
      <label>Split Method</label>
      <div class="split-toggle-group">
        <button type="button" class="split-toggle-btn active" id="btnSplitEven" onclick="setSplitMode('even')">Split Evenly</button>
        <button type="button" class="split-toggle-btn" id="btnSplitExact" onclick="setSplitMode('exact')">Exact Amounts</button>
      </div>
    </div>

    <div class="form-group">
      <label for="expenseDesc">Description</label>
      <input type="text" id="expenseDesc" placeholder="e.g. Dinner, Taxi">
    </div>

    <div class="form-group" id="totalAmountGroup">
      <label for="expenseAmount">Total Amount ($)</label>
      <input type="number" id="expenseAmount" step="1" min="1" placeholder="0">
    </div>

    <div class="form-group">
      <label for="paidBySelect">Paid By</label>
      <select id="paidBySelect"></select>
    </div>

    <div class="form-group">
      <label id="splitAmongLabel">Split Among</label>
      <div id="splitAmongContainer"></div>
    </div>

    <button type="button" class="btn-block" onclick="addExpense()">Add Expense</button>
  </div>

  <div class="card">
    <div class="card-header">
      <h2 class="card-title"><span class="step-badge">3</span> Expenses Summary</h2>
    </div>
    <div id="expenseList">
      <div class="empty-state">No expenses logged yet.</div>
    </div>
  </div>

  <div class="card">
    <div class="card-header">
      <h2 class="card-title"><span class="step-badge">4</span> Settlement Plan</h2>
      <button type="button" id="copyBtn" class="btn-secondary" onclick="copySettlement()">📋 Copy Summary</button>
    </div>
    <div id="settlementResults">
      <div class="empty-state">Add participants and expenses to generate plan.</div>
    </div>
  </div>

</div>

<script>
  let people = [];
  let expenses = [];
  let currentTransactions = [];
  let splitMode = 'even';

  window.addEventListener('DOMContentLoaded', () => {
    updateUI();
  });

  function setSplitMode(mode) {
    splitMode = mode;
    document.getElementById('btnSplitEven').classList.toggle('active', mode === 'even');
    document.getElementById('btnSplitExact').classList.toggle('active', mode === 'exact');
    renderSplitContainer();
  }

  function addPerson() {
    const input = document.getElementById('personName');
    const name = input.value.trim();
    if (!name || people.includes(name)) return;

    people.push(name);
    input.value = '';
    updateUI();
  }

  function removePerson(index) {
    const personToRemove = people[index];
    people.splice(index, 1);

    expenses = expenses.map(e => {
      const newSplits = { ...e.splits };
      delete newSplits[personToRemove];
      const newTotal = Object.values(newSplits).reduce((sum, val) => sum + val, 0);
      return { ...e, splits: newSplits, amount: newTotal };
    }).filter(e => e.paidBy !== personToRemove && Object.keys(e.splits).length > 0);

    updateUI();
    calculateSettlements();
  }

  function renderSplitContainer() {
    const container = document.getElementById('splitAmongContainer');
    if (!container) return;
    
    if (people.length === 0) {
      container.innerHTML = `<span class="empty-state">Add participants above first.</span>`;
      return;
    }

    if (splitMode === 'even') {
      container.innerHTML = `
        <div class="checkbox-grid">
          ${people.map(p => `
            <label class="checkbox-card">
              <input type="checkbox" value="${p}" class="split-even-cb" checked> ${p}
            </label>
          `).join('')}
        </div>
      `;
    } else {
      container.innerHTML = `
        <div class="exact-grid">
          ${people.map(p => `
            <div class="exact-row">
              <label class="checkbox-card" style="flex: 1;">
                <input type="checkbox" value="${p}" class="split-exact-cb" checked onchange="toggleExactInput('${p}')"> ${p}
              </label>
              <input type="number" step="1" min="0" placeholder="0" class="exact-input" id="exact-input-${p}" style="width: 100px;">
            </div>
          `).join('')}
        </div>
      `;
    }
  }

  function toggleExactInput(person) {
    const cb = document.querySelector(`.split-exact-cb[value="${person}"]`);
    const input = document.getElementById(`exact-input-${person}`);
    if (input && cb) {
      input.disabled = !cb.checked;
      if (!cb.checked) input.value = '';
    }
  }

  function addExpense() {
    const desc = document.getElementById('expenseDesc').value.trim();
    const paidBy = document.getElementById('paidBySelect').value;
    
    if (!desc || !paidBy) {
      alert("Please enter a description and select who paid.");
      return;
    }

    let splits = {};
    let total = 0;

    if (splitMode === 'even') {
      const amountVal = parseInt(document.getElementById('expenseAmount').value, 10);
      if (isNaN(amountVal) || amountVal <= 0) {
        alert("Please enter a valid dollar amount.");
        return;
      }

      total = Math.round(amountVal);
      const selected = Array.from(document.querySelectorAll('.split-even-cb:checked')).map(cb => cb.value);

      if (selected.length === 0) {
        alert("Please select at least one person sharing the expense.");
        return;
      }

      const numPeople = selected.length;
      const baseShare = Math.floor(total / numPeople);
      let remainder = total % numPeople;

      selected.forEach(person => {
        let share = baseShare;
        if (remainder > 0) {
          share += 1;
          remainder--;
        }
        splits[person] = share;
      });

    } else {
      const checkedBoxes = document.querySelectorAll('.split-exact-cb:checked');
      if (checkedBoxes.length === 0) {
        alert("Please select at least one person sharing the expense.");
        return;
      }

      let hasInvalidAmount = false;
      checkedBoxes.forEach(cb => {
        const person = cb.value;
        const inputEl = document.getElementById(`exact-input-${person}`);
        const val = inputEl ? parseInt(inputEl.value, 10) : NaN;
        if (isNaN(val) || val <= 0) {
          hasInvalidAmount = true;
        } else {
          const share = Math.round(val);
          splits[person] = share;
          total += share;
        }
      });

      if (hasInvalidAmount) {
        alert("Please enter a valid whole dollar amount for all selected participants.");
        return;
      }

      const totalInputVal = parseInt(document.getElementById('expenseAmount').value, 10);
      if (!isNaN(totalInputVal) && totalInputVal > 0) {
        if (totalInputVal !== total) {
          alert(`The sum of exact shares ($${total}) does not match Total Amount ($${totalInputVal}).`);
          return;
        }
      }
    }

    expenses.push({ desc, amount: total, paidBy, splits });
    
    document.getElementById('expenseDesc').value = '';
    document.getElementById('expenseAmount').value = '';
    
    updateUI();
    calculateSettlements();
  }

  function removeExpense(index) {
    expenses.splice(index, 1);
    updateUI();
    calculateSettlements();
  }

  function updateUI() {
    const peopleTags = document.getElementById('peopleTags');
    if (people.length === 0) {
      peopleTags.innerHTML = `<span class="empty-state">No participants added yet.</span>`;
    } else {
      peopleTags.innerHTML = people.map((p, i) => `
        <span class="person-tag">
          ${p}
          <button type="button" class="btn-remove-tag" onclick="removePerson(${i})" title="Remove ${p}">✕</button>
        </span>
      `).join('');
    }

    const paidBySelect = document.getElementById('paidBySelect');
    paidBySelect.innerHTML = people.map(p => `<option value="${p}">${p}</option>`).join('');

    renderSplitContainer();

    const expenseList = document.getElementById('expenseList');
    if (expenses.length === 0) {
      expenseList.innerHTML = `<div class="empty-state">No expenses logged yet.</div>`;
    } else {
      expenseList.innerHTML = expenses.map((e, i) => {
        const splitDetails = Object.entries(e.splits)
          .map(([p, amt]) => `${p} ($${amt})`)
          .join(', ');

        return `
          <div class="list-item">
            <div>
              <div class="list-item-title">${e.desc}</div>
              <div class="list-item-sub">Paid by <strong>${e.paidBy}</strong> — ${splitDetails}</div>
            </div>
            <div style="display: flex; align-items: center; gap: 8px;">
              <span style="font-weight: 700;">$${e.amount}</span>
              <button type="button" class="btn-delete-item" onclick="removeExpense(${i})" title="Delete expense">✕</button>
            </div>
          </div>
        `;
      }).join('');
    }
  }

  function calculateSettlements() {
    const balances = {};
    people.forEach(p => balances[p] = 0);

    expenses.forEach(({ paidBy, amount, splits }) => {
      if (balances.hasOwnProperty(paidBy)) {
        balances[paidBy] += amount;
      }
      for (const [person, share] of Object.entries(splits)) {
        if (balances.hasOwnProperty(person)) {
          balances[person] -= share;
        }
      }
    });

    const debtors = [];
    const creditors = [];

    for (const [person, balance] of Object.entries(balances)) {
      if (balance < 0) debtors.push({ person, amount: -balance });
      else if (balance > 0) creditors.push({ person, amount: balance });
    }

    currentTransactions = [];
    let i = 0, j = 0;

    while (i < debtors.length && j < creditors.length) {
      const debtor = debtors[i];
      const creditor = creditors[j];
      const settled = Math.min(debtor.amount, creditor.amount);

      currentTransactions.push({ 
        debtor: debtor.person, 
        creditor: creditor.person, 
        amount: settled 
      });

      debtor.amount -= settled;
      creditor.amount -= settled;

      if (debtor.amount === 0) i++;
      if (creditor.amount === 0) j++;
    }

    const container = document.getElementById('settlementResults');
    if (expenses.length === 0) {
      container.innerHTML = `<div class="empty-state">Add participants and expenses to generate plan.</div>`;
    } else if (currentTransactions.length === 0) {
      container.innerHTML = `<div class="settlement-card"><span class="settlement-text">Everyone is even! No payments needed.</span></div>`;
    } else {
      container.innerHTML = currentTransactions.map(t => `
        <div class="settlement-card">
          <span class="settlement-text"><strong>${t.debtor}</strong> pays <strong>${t.creditor}</strong></span>
          <span class="settlement-amount">$${t.amount}</span>
        </div>
      `).join('');
    }
  }

  function copySettlement() {
    const copyBtn = document.getElementById('copyBtn');

    if (expenses.length === 0) {
      alert("Please add expenses first.");
      return;
    }

    const totalSpent = expenses.reduce((sum, e) => sum + e.amount, 0);

    let text = `📊 EXPENSE SUMMARY\nTotal Spent: $${totalSpent}\n\n`;
    
    expenses.forEach(e => {
      text += `• ${e.desc}: $${e.amount} (Paid by ${e.paidBy})\n`;
    });

    text += `\n🤝 SETTLEMENT PLAN\n`;

    if (currentTransactions.length === 0) {
      text += `Everyone is even!`;
    } else {
      text += currentTransactions.map(t => `• ${t.debtor} → ${t.creditor}: $${t.amount}`).join('\n');
    }

    navigator.clipboard.writeText(text).then(() => {
      const originalText = copyBtn.innerText;
      copyBtn.innerText = "✓ Copied";
      setTimeout(() => {
        copyBtn.innerText = originalText;
      }, 2000);
    }).catch(() => {
      alert("Failed to copy automatically.");
    });
  }
</script>

</body>
</html>
